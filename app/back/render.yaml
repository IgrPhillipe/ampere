#
# The API web service is configured in the Render dashboard, not here. Its environment
# variables, besides the database ones (see app/back/README.md):
#   JWT_SECRET                 token signing secret, at least 32 characters
#   SIGNING_KEYSTORE           PKCS12 of the AMPERE certificate, in base64 (required in prod)
#   SIGNING_KEYSTORE_PASSWORD  password of that PKCS12
#   FRONT_URL                  front-end origin, e.g. https://ampere-virid.vercel.app
version: "1"
projects:
- name: ampere
  environments:
  - name: Production
    databases:
    - name: ampere-db
      databaseName: ampere_db
      user: ampere_db_user
      plan: free
      region: oregon
      ipAllowList:
      - source: 0.0.0.0/0
        description: everywhere
      postgresMajorVersion: "18"
