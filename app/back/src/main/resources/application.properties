spring.application.name=ampere-api

# The Vite proxy does not rewrite the path, so /api reaches Spring intact.
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

# DATABASE_URL is a JDBC URL. See app/back/README.md.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ampere}
spring.datasource.username=${DATABASE_USER:ampere}
spring.datasource.password=${DATABASE_PASSWORD:ampere}

# No Flyway: Hibernate creates and updates the tables from the entities.
# DDL_AUTO=create rebuilds the schema from scratch and DELETES ALL DATA.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# The `true` default hides lazy loading problems until they become bugs in production.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Relative to the context-path: the UI answers at /api/docs.
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# JWT signature, with no default in version control. HS256 requires at least 32 characters.
ampere.jwt.secret=${JWT_SECRET:}
ampere.jwt.expiration=${JWT_EXPIRATION:8h}

# Origins allowed to call the API from another domain. Empty = same origin only.
ampere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
