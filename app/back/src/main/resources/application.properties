spring.application.name=ampere-api

# O proxy do Vite nao reescreve o caminho, entao /api chega inteiro ao Spring.
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

# DATABASE_URL e uma URL JDBC. Ver app/back/README.md.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ampere}
spring.datasource.username=${DATABASE_USER:ampere}
spring.datasource.password=${DATABASE_PASSWORD:ampere}

# Sem Flyway: o Hibernate cria e atualiza as tabelas a partir das entidades.
# DDL_AUTO=create recria o schema do zero e APAGA TODOS OS DADOS.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# O default `true` esconde problema de lazy loading ate virar bug em producao.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Relative to the context-path: the UI answers at /api/docs.
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Assinatura do JWT, sem default versionado. HS256 exige no minimo 32 caracteres.
ampere.jwt.secret=${JWT_SECRET:}
ampere.jwt.expiration=${JWT_EXPIRATION:8h}

# Origens que podem chamar a API de outro dominio. Vazio = so mesma origem.
ampere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
