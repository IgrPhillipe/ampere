spring.application.name=ampere-api

# O proxy do Vite nao reescreve o caminho, entao /api chega inteiro ao Spring.
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

# DATABASE_URL e uma URL JDBC. Ver app/back/README.md.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ampere}
spring.datasource.username=${DATABASE_USER:ampere}
spring.datasource.password=${DATABASE_PASSWORD:ampere}

# Sem Flyway por enquanto: o Hibernate cria e atualiza as tabelas a partir das
# entidades. Ver a pendencia 16 em docs/pendencias.md.
#
# `update` nunca altera tipo de coluna, e nao consegue acrescentar coluna NOT
# NULL a tabela que ja tem linhas — ele registra um WARN e sobe assim mesmo, com
# a coluna faltando. A aplicacao atende normalmente ate a primeira consulta que
# toca nela, e ai devolve 500 sem dizer por que.
#
# DDL_AUTO=create existe como alavanca de recuperacao para quem nao tem acesso
# ao banco: apaga o schema, recria pelas entidades e o DataSeeder repovoa.
# APAGA TODOS OS DADOS a cada subida — use uma vez e remova a variavel.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

# O default `true` mantem a sessao do Hibernate aberta durante a serializacao,
# o que esconde problema de lazy loading ate virar bug em producao.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Relative to the context-path: the UI answers at /api/docs.
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs

# Assinatura do JWT. Nao ha default versionado: segredo que mora no repositorio
# nao protege ninguem, porque quem le o codigo assina um token valido.
#
# Sem JWT_SECRET a aplicacao gera uma chave aleatoria por execucao, entao sobe
# sem configuracao em desenvolvimento — ao preco de o token nao sobreviver a um
# reinicio. Com o profile `prod`, sem JWT_SECRET ela nao sobe.
# HS256 exige 256 bits, ou seja no minimo 32 caracteres.
ampere.jwt.secret=${JWT_SECRET:}
ampere.jwt.expiration=${JWT_EXPIRATION:8h}

# Origens que podem chamar a API de outro dominio. Vazio = so mesma origem, que
# e o caso quando o front sai por um proxy do proprio deploy. Front e API em
# dominios diferentes precisam da origem aqui, exata ou em padrao:
#   CORS_ALLOWED_ORIGINS=https://ampere.vercel.app,https://*-igrph.vercel.app
ampere.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
