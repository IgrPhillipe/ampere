spring.application.name=ampere-api

# O proxy do Vite nao reescreve o caminho, entao /api chega inteiro ao Spring.
server.servlet.context-path=/api
server.port=${SERVER_PORT:8080}

# Caminho relativo ao context-path: a UI do Swagger fica em /api/docs em vez do
# /api/swagger-ui/index.html que o springdoc usa por padrao.
springdoc.swagger-ui.path=/docs

# DATABASE_URL e uma URL JDBC. Ver app/back/README.md.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ampere}
spring.datasource.username=${DATABASE_USER:ampere}
spring.datasource.password=${DATABASE_PASSWORD:ampere}

# Sem Flyway por enquanto: o Hibernate cria e atualiza as tabelas a partir das
# entidades. Ver a pendencia registrada em docs/pendencias.md.
spring.jpa.hibernate.ddl-auto=update

# O default `true` mantem a sessao do Hibernate aberta durante a serializacao,
# o que esconde problema de lazy loading ate virar bug em producao.
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Relative to the context-path: the UI answers at /api/docs.
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/v3/api-docs
