name: ci

on:
  push:
    branches: [main]
  pull_request:

# Um push novo no mesmo PR cancela a execucao anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: back-end
    runs-on: ubuntu-latest

    # O application.properties de teste aponta para ampere_test por padrao.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ampere
          POSTGRES_PASSWORD: ampere
          POSTGRES_DB: ampere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` cobre spotless:check (fase validate), compilacao e a suite.
      - name: clean verify
        working-directory: app/back
        run: ./mvnw -B clean verify

  front:
    name: front-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # O packageManager mora em app/front, nao na raiz do repositorio.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/front/pnpm-lock.yaml

      - name: install
        working-directory: app/front
        run: pnpm install --frozen-lockfile

      # `validate:ci` apenas verifica; o `validate` normal escreve nos arquivos.
      - name: validate
        working-directory: app/front
        run: pnpm validate:ci

      - name: build
        working-directory: app/front
        run: pnpm build
