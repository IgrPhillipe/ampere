name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back-end
    runs-on: ubuntu-latest

    # Matches the default in src/test/resources/application.properties.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ampere
          POSTGRES_PASSWORD: ampere
          POSTGRES_DB: ampere_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Clean verify
        working-directory: app/back
        run: ./mvnw -B clean verify

  front:
    name: Front-end
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # packageManager lives in app/front, not at the repository root.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/front/pnpm-lock.yaml

      - name: Install
        working-directory: app/front
        run: pnpm install --frozen-lockfile

      # validate:ci checks; validate writes.
      - name: Validate
        working-directory: app/front
        run: pnpm validate:ci

      - name: Build
        working-directory: app/front
        run: pnpm build
