name: deploy

on: push

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: vercel
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/front

    env:
      VERCEL_SCOPE: igrph
      VERCEL_PROJECT: ampere
      # main goes to production, every other branch gets a preview URL.
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/front/pnpm-lock.yaml

      - run: npm install --global vercel@latest

      # Linking here keeps VERCEL_TOKEN as the only secret.
      - name: link
        run: vercel link --yes --scope "$VERCEL_SCOPE" --project "$VERCEL_PROJECT" --token "$TOKEN"

      - name: pull environment
        run: vercel pull --yes --environment="$ENVIRONMENT" --token "$TOKEN"

      - name: build
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel build --prod --token "$TOKEN"
          else
            vercel build --token "$TOKEN"
          fi

      - name: deploy
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel deploy --prebuilt --prod --token "$TOKEN"
          else
            vercel deploy --prebuilt --token "$TOKEN"
          fi
