name: deploy

on: push

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vercel:
    name: vercel
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # main goes to production, every other branch gets a preview URL.
      ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/front/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: app/front/pnpm-lock.yaml

      - run: npm install --global vercel@latest

      - name: pull environment
        working-directory: app/front
        run: vercel pull --yes --environment=$ENVIRONMENT --token=${{ secrets.VERCEL_TOKEN }}

      - name: build
        working-directory: app/front
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel build --token=${{ secrets.VERCEL_TOKEN }}
          fi

      - name: deploy
        working-directory: app/front
        run: |
          if [ "$ENVIRONMENT" = production ]; then
            vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
          else
            vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
          fi
